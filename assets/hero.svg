<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Hey there. I’m Jash.</title>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#2997ff"/><stop offset=".3" stop-color="#bf5af2"/><stop offset=".6" stop-color="#ff375f"/><stop offset=".82" stop-color="#ff9f0a"/><stop offset="1" stop-color="#2997ff"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif;text-anchor:middle}
.h{font-size:100px;font-weight:700;letter-spacing:-3px;fill:url(#g)}
.r{font-size:34px;font-weight:600;fill:#f5f5f7;letter-spacing:-.5px}
.s{font-size:19px;fill:#86868b}
.h1{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .2s backwards}
.h2{animation:rise 1.1s cubic-bezier(.16,1,.3,1) .45s backwards}
.s{animation:rise 1.1s cubic-bezier(.16,1,.3,1) 1s backwards}
.r{animation:cycle 9s ease-in-out infinite backwards}
.r1{animation-delay:1.3s}.r2{animation-delay:4.3s}.r3{animation-delay:7.3s}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
@keyframes cycle{0%{opacity:0;transform:translateY(16px)}6%,28%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="460" fill="#000"/>
<g filter="url(#b)" opacity=".6">
<circle r="130" fill="#2997ff" cx="200" cy="120"><animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="120;260;120" dur="11s" repeatCount="indefinite"/></circle>
<circle r="140" fill="#bf5af2" cx="620" cy="360"><animate attributeName="cx" values="620;380;620" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="360;180;360" dur="13s" repeatCount="indefinite"/></circle>
<circle r="110" fill="#ff375f" cx="860" cy="120"><animate attributeName="cx" values="860;680;860" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="120;300;120" dur="15s" repeatCount="indefinite"/></circle>
</g>
<rect width="1000" height="460" fill="#000" opacity=".45"/>
<text class="h h1" x="500" y="160">Hey there.</text>
<text class="h h2" x="500" y="262">I’m Jash.</text>
<text class="r r1" x="500" y="338">Learning how machines learn.</text>
<text class="r r2" x="500" y="338">Building quick hacks and real software.</text>
<text class="r r3" x="500" y="338">Curious about how things break.</text>
<text class="s" x="500" y="400">MBA Tech in Artificial Intelligence, MPSTME NMIMS</text>
</svg>

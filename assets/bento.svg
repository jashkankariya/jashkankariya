.e{stroke:#2997ff;stroke-opacity:.55;stroke-width:1.4;stroke-dasharray:3 7;animation:flow 2.4s linear infinite}
.n{fill:#2997ff;animation:pulse 3s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.dot{fill:#30d158}
.ring{fill:none;stroke:#30d158;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(3.2);opacity:0}}
.st{fill:none;stroke:#f5f5f7;stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:6 10;animation:steam 3s linear infinite}
@keyframes steam{to{stroke-dashoffset:-48}}
.sw{transform-origin:270px 448px;animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bl{fill:#30d158;animation:blip 4s ease-out infinite backwards}
@keyframes blip{0%{opacity:0}8%{opacity:1}45%,100%{opacity:0}}
.cb{transform-box:fill-box;transform-origin:left center;animation:type 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes type{0%{transform:scaleX(0)}25%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.cur{fill:#f5f5f7;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

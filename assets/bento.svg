<title id="t">About Jash: exploring AI, MBA Tech student at MPSTME NMIMS, open to freelance and hybrid work, cyber security, coffee, and software hacks.</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','Segoe UI',Arial,sans-serif}
.k{font-size:17px;fill:#86868b}
.big{font-size:40px;font-weight:700;fill:#f5f5f7;letter-spacing:-1.2px}
